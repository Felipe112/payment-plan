name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Permisos mínimos que necesita el despliegue oficial de Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos push seguidos, no se pisan: termina el despliegue en curso
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4 # toma la versión de "packageManager" en package.json

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos
        run: pnpm run check

      - name: Auditar cálculos y validaciones
        run: pnpm run audit

      - name: Verificar el motor y la exportación a Excel
        run: pnpm run verify

      - name: Construir el sitio
        run: pnpm run build
        env:
          # Con dominio propio: SITE_URL: https://plan.cacharreo.dev y BASE_PATH: /
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Empaquetar para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
